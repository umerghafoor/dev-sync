<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" role="img" aria-labelledby="title desc">
  <title id="title">How devsync works</title>
  <desc id="desc">Your machine runs the editor, coding agent and devsync. Every exchange with the remote machine is a short ssh session: push changed files, start a command, collect its output and exit code, and pull back files it created. The command runs detached on the remote, so nothing stays connected while it runs.</desc>
  <style>
    .bg { fill: none; }
    .panel { fill: #f6f8fa; stroke: #d0d7de; }
    .node { fill: #ffffff; stroke: #8c959f; }
    .hub { fill: #ffffff; stroke: #0969da; stroke-width: 2; }
    .title { fill: #1f2328; font: 600 15px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .label { fill: #1f2328; font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .sub { fill: #59636e; font: 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { fill: #1f2328; font: 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .note { fill: #59636e; font: italic 12.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .out { stroke: #0969da; stroke-width: 2; fill: none; }
    .in { stroke: #1a7f37; stroke-width: 2; fill: none; }
    .local { stroke: #8c959f; stroke-width: 1.5; fill: none; }
    .out-head { fill: #0969da; }
    .in-head { fill: #1a7f37; }
    .local-head { fill: #8c959f; }
    .out-text { fill: #0969da; font: 600 12.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .in-text { fill: #1a7f37; font: 600 12.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .badge { fill: #ddf4ff; stroke: #54aeff; }
    @media (prefers-color-scheme: dark) {
      .panel { fill: #161b22; stroke: #30363d; }
      .node { fill: #0d1117; stroke: #6e7681; }
      .hub { fill: #0d1117; stroke: #4493f8; }
      .title, .label, .mono { fill: #e6edf3; }
      .sub, .note { fill: #9198a1; }
      .out { stroke: #4493f8; }
      .in { stroke: #3fb950; }
      .local { stroke: #6e7681; }
      .out-head { fill: #4493f8; }
      .in-head { fill: #3fb950; }
      .local-head { fill: #6e7681; }
      .out-text { fill: #4493f8; }
      .in-text { fill: #3fb950; }
      .badge { fill: #0c2d6b; stroke: #1f6feb; }
    }
  </style>
  <defs>
    <marker id="h-out" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="out-head" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="h-in" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="in-head" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="h-local" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="local-head" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>

  <!-- panels -->
  <rect class="panel" x="20" y="20" width="310" height="440" rx="12"/>
  <text class="title" x="40" y="50">Your machine</text>
  <text class="sub" x="40" y="68">all editing happens here</text>

  <rect class="panel" x="570" y="20" width="310" height="440" rx="12"/>
  <text class="title" x="590" y="50">Remote machine</text>
  <text class="sub" x="590" y="68">runs the code · any ssh host</text>

  <!-- left nodes -->
  <rect class="node" x="45" y="88" width="260" height="52" rx="8"/>
  <text class="label" x="175" y="110" text-anchor="middle">Editor · Claude Code · terminal</text>
  <text class="sub" x="175" y="128" text-anchor="middle">you (or an agent) write code</text>

  <rect class="hub" x="45" y="168" width="260" height="176" rx="10"/>
  <text class="label" x="175" y="196" text-anchor="middle" style="font-size:16px">devsync</text>
  <text class="sub" x="175" y="215" text-anchor="middle">CLI · VS Code extension · agent hook</text>
  <text class="sub" x="175" y="300" text-anchor="middle">hash cache · retries with backoff</text>
  <text class="sub" x="175" y="318" text-anchor="middle">conflict-safe pull-back</text>

  <rect class="node" x="45" y="372" width="260" height="66" rx="8"/>
  <text class="mono" x="175" y="397" text-anchor="middle">.devsync/jobs/&lt;id&gt;/</text>
  <text class="sub" x="175" y="417" text-anchor="middle">output.log · status.json (local results)</text>

  <!-- right nodes -->
  <rect class="node" x="595" y="88" width="260" height="52" rx="8"/>
  <text class="label" x="725" y="110" text-anchor="middle">Project files</text>
  <text class="sub" x="725" y="128" text-anchor="middle">mirror of your tree, written atomically</text>

  <rect class="hub" x="595" y="168" width="260" height="176" rx="10"/>
  <text class="label" x="725" y="196" text-anchor="middle" style="font-size:16px">devsync agent</text>
  <text class="sub" x="725" y="215" text-anchor="middle">static binary, uploaded on first use</text>
  <text class="sub" x="725" y="300" text-anchor="middle">one process per short session</text>
  <text class="sub" x="725" y="318" text-anchor="middle">resumes interrupted uploads</text>

  <rect class="node" x="595" y="372" width="260" height="66" rx="8"/>
  <text class="label" x="725" y="395" text-anchor="middle">Detached job</text>
  <text class="sub" x="725" y="415" text-anchor="middle">keeps running if the link drops</text>
  <text class="mono" x="725" y="431" text-anchor="middle" style="font-size:11px">output.log · exit_code</text>

  <!-- local arrows -->
  <path class="local" d="M175 140 V164" marker-end="url(#h-local)"/>
  <path class="local" d="M175 344 V368" marker-end="url(#h-local)"/>
  <path class="local" d="M725 168 V144" marker-end="url(#h-local)"/>
  <path class="local" d="M725 344 V368" marker-end="url(#h-local)"/>

  <!-- session arrows -->
  <path class="out" d="M305 238 H591" marker-end="url(#h-out)"/>
  <text class="out-text" x="448" y="231" text-anchor="middle">① push changed files</text>

  <path class="out" d="M305 268 H591" marker-end="url(#h-out)"/>
  <text class="out-text" x="448" y="261" text-anchor="middle">② start command → job id</text>

  <path class="in" d="M595 298 H309" marker-end="url(#h-in)"/>
  <text class="in-text" x="448" y="291" text-anchor="middle">③ collect output + exit code</text>

  <path class="in" d="M595 328 H309" marker-end="url(#h-in)"/>
  <text class="in-text" x="448" y="321" text-anchor="middle">④ pull back generated files</text>

  <rect class="badge" x="336" y="176" width="226" height="34" rx="17"/>
  <text class="label" x="449" y="198" text-anchor="middle" style="font-size:12px">each arrow = one short ssh session</text>

  <text class="note" x="450" y="486" text-anchor="middle">Nothing stays connected while a command runs: a dropped link only delays output, it never kills the job.</text>
</svg>
