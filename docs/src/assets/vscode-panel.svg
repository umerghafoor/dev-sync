<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 500" width="440" height="500" role="img" aria-labelledby="t d">
  <title id="t">devsync in VS Code's Source Control view</title>
  <desc id="d">The devsync panel: a command box, a list of files not yet on the remote with A and M badges, a conflict, and remote jobs marked succeeded, running and failed. The status bar shows devsync synced with one job running.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .bg { fill: #181818; }
    .frame { fill: none; stroke: #2b2b2b; }
    .head { fill: #bbbbbb; font-size: 11px; font-weight: 600; letter-spacing: 0.6px; }
    .prov { fill: #cccccc; font-size: 11px; font-weight: 700; letter-spacing: 0.4px; }
    .grp { fill: #cccccc; font-size: 11px; font-weight: 700; letter-spacing: 0.4px; }
    .name { fill: #cccccc; font-size: 13px; }
    .dim { fill: #8b8b8b; font-size: 12px; }
    .ph { fill: #8b8b8b; font-size: 13px; }
    .tool { fill: #c5c5c5; font-size: 14px; }
    .count { fill: #ffffff; font-size: 11px; font-weight: 600; }
    .countbg { fill: #616161; }
    .input { fill: #313131; stroke: #0078d4; stroke-width: 1.2; }
    .sel { fill: #04395e; }
    .A { fill: #73c991; font-size: 12px; font-weight: 700; }
    .M { fill: #e2c08d; font-size: 12px; font-weight: 700; }
    .C { fill: #e4676b; font-size: 12px; font-weight: 700; }
    .ok { fill: #73c991; font-size: 13px; font-weight: 700; }
    .bad { fill: #f14c4c; font-size: 13px; font-weight: 700; }
    .run { fill: #3794ff; font-size: 13px; font-weight: 700; }
    .status { fill: #0078d4; }
    .stext { fill: #ffffff; font-size: 12px; }
    .callout { fill: #3794ff; font-size: 11px; font-style: italic; }
  </style>

  <rect class="bg" x="0" y="0" width="440" height="500" rx="8"/>
  <rect class="frame" x="0.5" y="0.5" width="439" height="499" rx="8"/>

  <text class="head" x="16" y="26">SOURCE CONTROL</text>

  <!-- provider header with toolbar -->
  <text class="prov" x="16" y="56">⌄  DEVSYNC</text>
  <g fill="none" stroke="#c5c5c5" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M283 46 L292 52 L283 58 Z" fill="#c5c5c5"/>
    <path d="M305 57 h11 a3.5 3.5 0 0 0 0 -7 a5 5 0 0 0 -9.5 -1 a3.5 3.5 0 0 0 -1.5 8 z"/>
    <path d="M311 55 v-6 M308.5 51.5 L311 49 L313.5 51.5"/>
    <path d="M332 46 v12 M338 46 v12" stroke-width="2.2"/>
    <rect x="352" y="46" width="14" height="12" rx="2"/>
    <path d="M355 50 l2.5 2 l-2.5 2 M359 55 h4"/>
    <path d="M388 49 a6 6 0 1 0 1 5"/>
    <path d="M389 45 v4.5 h-4.5"/>
  </g>
  <text class="tool" x="402" y="57">⋯</text>

  <!-- command box -->
  <rect class="input" x="16" y="70" width="408" height="32" rx="3"/>
  <text class="ph" x="26" y="91">Command to run on the remote (⌘Enter)</text>
  <text class="callout" x="16" y="120">type e.g. “pytest -x” and press ⌘Enter, like a commit message</text>

  <!-- group: not on remote yet -->
  <text class="grp" x="16" y="150">⌄  NOT ON REMOTE YET</text>
  <rect class="countbg" x="398" y="138" width="22" height="16" rx="8"/>
  <text class="count" x="409" y="150" text-anchor="middle">2</text>

  <rect class="sel" x="8" y="160" width="424" height="24"/>
  <text class="name" x="36" y="177">api.py</text>
  <text class="dim" x="84" y="177">src</text>
  <text class="M" x="410" y="177">M</text>

  <text class="name" x="36" y="201">.env</text>
  <text class="A" x="410" y="201">A</text>

  <!-- group: conflicts -->
  <text class="grp" x="16" y="236">⌄  CONFLICTS</text>
  <rect class="countbg" x="398" y="224" width="22" height="16" rx="8"/>
  <text class="count" x="409" y="236" text-anchor="middle">1</text>
  <text class="name" x="36" y="262">schema.py</text>
  <text class="dim" x="108" y="262">src/db</text>
  <text class="tool" x="330" y="263" style="font-size:13px">⇄</text>
  <text class="tool" x="352" y="263" style="font-size:13px">↩</text>
  <text class="tool" x="374" y="263" style="font-size:13px">✓</text>
  <text class="C" x="412" y="262">!</text>
  <text class="callout" x="36" y="282">compare · keep yours · accept remote</text>

  <!-- group: remote jobs -->
  <text class="grp" x="16" y="316">⌄  REMOTE JOBS</text>
  <rect class="countbg" x="398" y="304" width="22" height="16" rx="8"/>
  <text class="count" x="409" y="316" text-anchor="middle">3</text>

  <text class="name" x="36" y="342">python train.py --epochs 50</text>
  <text class="dim" x="224" y="342">.devsync/jobs/1794…</text>
  <text class="run" x="408" y="342">…</text>

  <text class="name" x="36" y="368">pytest -x</text>
  <text class="dim" x="104" y="368">.devsync/jobs/1794…</text>
  <text class="ok" x="408" y="368">✓</text>

  <text class="name" x="36" y="394">npm run build</text>
  <text class="dim" x="134" y="394">.devsync/jobs/1794…</text>
  <text class="bad" x="408" y="394">✗</text>
  <text class="callout" x="36" y="414">click to open output · ■ stop · ↻ run again</text>

  <!-- status bar -->
  <rect class="status" x="0" y="472" width="440" height="28"/>
  <rect class="status" x="0" y="472" width="440" height="20"/>
  <text class="stext" x="14" y="490">✓ devsync · ▶ 1</text>
  <text class="stext" x="426" y="490" text-anchor="end" style="opacity:0.85">Ln 12, Col 4</text>
</svg>
