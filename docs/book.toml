[book]
title = "devsync"
description = "Edit locally, run remotely — sync and remote execution built for flaky connections."
authors = ["devsync contributors"]
language = "en"
src = "src"

[output.html]
git-repository-url = "https://github.com/umerghafoor/dev-sync"
edit-url-template = "https://github.com/umerghafoor/dev-sync/edit/main/docs/{path}"
site-url = "/dev-sync/docs/"
additional-css = ["theme/devsync.css"]
additional-js = ["theme/devsync.js"]
default-theme = "light"
preferred-dark-theme = "navy"

[output.html.search]
enable = true
