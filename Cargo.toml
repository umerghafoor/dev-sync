[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.88"
authors = ["Umer Ghafoor"]
repository = "https://github.com/umerghafoor/dev-sync"
homepage = "https://umerghafoor.github.io/dev-sync/"
documentation = "https://umerghafoor.github.io/dev-sync/"
keywords = ["ssh", "sync", "remote", "rsync", "devtools"]
categories = ["command-line-utilities", "development-tools", "filesystem"]

[workspace.dependencies]
devsync-proto = { path = "crates/devsync-proto" }
devsync-fs = { path = "crates/devsync-fs" }
devsync-agent = { path = "crates/devsync-agent" }
devsync-transport = { path = "crates/devsync-transport" }
devsync-client = { path = "crates/devsync-client" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1.1", default-features = false, features = ["use-std"] }
toml = "0.8"
toml_edit = "0.22"
thiserror = "2"
anyhow = "1"
blake3 = { version = "1", features = ["pure"] }
lz4_flex = "0.11"
ignore = "0.4"
libc = "0.2"
clap = { version = "4", features = ["derive", "env"] }
notify-debouncer-mini = "0.4"
ctrlc = { version = "3", features = ["termination"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hex = "0.4"
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
